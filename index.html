<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDF V-Frees Generator</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #scene-container { width: 100%; height: 100vh; }
        #controls {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255,255,255,0.92); padding: 14px;
            width: 280px; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            font-size: 13px; max-height: calc(100vh - 30px); overflow-y: auto;
        }
        .step { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        .step:last-child { border-bottom: none; }
        .step h3 { margin: 0 0 8px 0; font-size: 14px; }
        label { display: block; margin: 4px 0; }
        input[type="number"], input[type="text"], select { width: 130px; }
        input[type="range"] { width: 130px; vertical-align: middle; }
        .button-container { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
        .button-container button { padding: 8px 14px; font-size: 13px; cursor: pointer; }
        #hashRow { display: flex; gap: 4px; align-items: center; }
        #hash { font-family: monospace; font-size: 11px; flex: 1; }
        #renderTime { font-size: 11px; color: #666; margin-top: 4px; }
        .column-section, .row-section { margin-bottom: 8px; padding-left: 8px; border-left: 2px solid #eee; }
    </style>
</head>
<body>
    <div id="controls">
        <div class="step" id="step-hash">
            <h3>Seed</h3>
            <div id="hashRow">
                <input type="text" id="hash" value="0xa87e40e21d873faf">
                <button onclick="regenerateHash()" title="Regenerate">⟳</button>
            </div>
            <div id="renderTime"></div>
        </div>

        <div class="step" id="step1-panel">
            <h3>1. Panel</h3>
            <label>Width (mm): <input type="number" id="width" value="500" min="100" max="10000" onkeypress="checkEnterKey(event)"></label>
            <label>Height (mm): <input type="number" id="height" value="500" min="100" max="10000" onkeypress="checkEnterKey(event)"></label>
            <label>Thickness (mm): <input type="number" id="panelThickness" value="18" min="1" max="100" onkeypress="checkEnterKey(event)"></label>
            <label>Columns: <input type="number" id="columns" value="1" min="1" max="10" onchange="updateColumnInputs()" onkeypress="checkEnterKey(event)"></label>
            <label>Spacing vertical (mm): <input type="number" id="spacing" value="4" min="0" max="100" onkeypress="checkEnterKey(event)"></label>
            <label>Spacing horizontal (mm): <input type="number" id="spacingHorizontal" value="4" min="0" max="100" onkeypress="checkEnterKey(event)"></label>
            <div id="column-sections"></div>
        </div>

        <div class="step" id="step2-material">
            <h3>2. Material</h3>
            <label>RAL kleur:
                <select id="ralCode" onchange="updatePanel()"></select>
            </label>
        </div>

        <div class="step" id="step3-carving">
            <h3>3. Carving</h3>
            <label>Tool:
                <select id="bit" onchange="updatePanel()">
                    <option value="45-deg" selected>45° V-frees (diep)</option>
                    <option value="30-deg">30° V-frees (ondiep)</option>
                </select>
            </label>
            <label>Placement:
                <select id="placement" onchange="updatePanel()">
                    <option value="chaos" selected>Chaos (overal)</option>
                    <option value="grid">Grid</option>
                    <option value="rows">Rows</option>
                    <option value="columns">Columns</option>
                    <option value="cross">Cross</option>
                    <option value="diamonds">Diamonds</option>
                    <option value="square">Square</option>
                </select>
            </label>
            <label>Pattern:
                <select id="pattern" onchange="updatePanel()">
                    <option value="flow" selected>Flow (chaos)</option>
                    <option value="horizontal">Horizontaal</option>
                    <option value="vertical">Verticaal</option>
                    <option value="diagonal">Diagonaal</option>
                    <option value="wavy">Wavy</option>
                    <option value="concentric">Concentrisch</option>
                    <option value="radial">Radiaal</option>
                    <option value="spiral">Spiraal</option>
                    <option value="cross-axis">Cross-gemixt</option>
                </select>
            </label>
            <label>Stroke length:
                <select id="strokeLength" onchange="updatePanel()">
                    <option value="short">Short</option>
                    <option value="normal" selected>Normal</option>
                    <option value="long">Long (rand-tot-rand)</option>
                </select>
            </label>
            <label>Thickness:
                <select id="strokeThickness" onchange="updatePanel()">
                    <option value="1">Fine</option>
                    <option value="2">Thin</option>
                    <option value="3" selected>Medium</option>
                    <option value="4">Thick</option>
                    <option value="5">Chunky</option>
                </select>
            </label>
            <label>Density:
                <select id="density" onchange="updatePanel()">
                    <option value="1">Sparse</option>
                    <option value="2">Loose</option>
                    <option value="3" selected>Compact</option>
                    <option value="4">Dense</option>
                    <option value="5">Wild</option>
                </select>
            </label>
            <label>Scale:
                <select id="patternScale" onchange="updatePanel()">
                    <option value="macro">Macro</option>
                    <option value="medium" selected>Medium</option>
                    <option value="micro">Micro</option>
                </select>
            </label>
            <label>Layers:
                <select id="layers" onchange="updatePanel()">
                    <option value="1" selected>One</option>
                    <option value="2">Two</option>
                    <option value="8">Many</option>
                </select>
            </label>
            <label>Frame:
                <select id="frame" onchange="updatePanel()">
                    <option value="none" selected>None</option>
                    <option value="thick">Thick</option>
                </select>
            </label>
        </div>

        <div class="step" id="step4-export">
            <h3>4. Export</h3>
            <button onclick="exportPNG()">Export PNG</button>
            <button onclick="exportModel()">Export OBJ</button>
            <button onclick="exportZip()">Export ZIP</button>
        </div>
    </div>

    <div class="button-container">
        <button onclick="updatePanel()">Update</button>
        <button onclick="resetView()">Reset view</button>
    </div>

    <div id="scene-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.3.2/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
